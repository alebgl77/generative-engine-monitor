name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Nothing here publishes, comments or tags, and
# actions/checkout leaves the job's token in .git/config where every subsequent
# step — including the dependency install scripts — can read it.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gem
          POSTGRES_PASSWORD: gem
          POSTGRES_DB: gem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gem"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gem:gem@localhost:5432/gem_test
      NEXTAUTH_SECRET: ci-only-secret-not-used-anywhere-else
      CREDENTIAL_KEYS: '{"1":"Y2ktb25seS1rZXktbm90LXVzZWQtaW4tcHJvZHVjdCE="}'
      CREDENTIAL_KEY_CURRENT: "1"
      CREDENTIAL_FINGERPRINT_PEPPER: ci-only-pepper-not-used-anywhere

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      # An empty providers table makes every run unplannable, so the seed is a
      # deployment step and is verified as one.
      - name: Seed reference data
        run: npm run db:seed

      - name: Verify reference data
        run: |
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const db = new PrismaClient();
            db.provider.count().then((n) => {
              console.log('providers seeded:', n);
              process.exit(n >= 5 ? 0 : 1);
            });
          "

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Coverage rather than a bare `vitest run`: the coverage provider is a
      # dependency like any other, and one that never runs in CI is one whose
      # breakage surfaces on someone's laptop instead.
      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Blocking, and last on purpose. An advisory is published by the outside
      # world, not by the author of the branch it fails: putting this first
      # meant one upstream disclosure erased the lint, type, test and build
      # signal on every open branch at once. Run it after the checks the author
      # can actually act on, so a red audit adds information instead of hiding
      # it. This job is a single cell, so the audit still runs exactly once per
      # commit; if this workflow ever grows an OS/Node matrix, move it to a job
      # of its own rather than repeat one registry-identical query per cell.
      #
      # The whole tree is audited, not `--omit=dev`. That is not just because
      # the advisories this gate was added for lived in the test and lint
      # toolchain — it is because `Dockerfile` copies the full node_modules
      # from the builder into the runner stage, so devDependencies genuinely
      # ship to production here (the entrypoint needs the Prisma CLI, and the
      # worker runs TypeScript through tsx). `--omit=dev` would therefore
      # under-report real runtime exposure, and the threshold is `moderate`
      # rather than `high` for the same reason: in this image there is no such
      # thing as a build-time-only package.
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
