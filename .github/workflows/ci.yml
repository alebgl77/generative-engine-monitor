name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token; checkout does not persist it for dependency install scripts.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gem
          POSTGRES_PASSWORD: gem
          POSTGRES_DB: gem_test
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gem"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gem:gem@localhost:5432/gem_test
      NEXTAUTH_URL: http://127.0.0.1:3100
      TZ: UTC
      SENTIMENT_ENABLED: "false"
      REGISTRATION_ENABLED: "true"
      NEXTAUTH_SECRET: ci-only-secret-not-used-anywhere-else
      CREDENTIAL_KEYS: '{"1":"Y2ktb25seS1rZXktbm90LXVzZWQtaW4tcHJvZHVjdCE="}'
      CREDENTIAL_KEY_CURRENT: "1"
      CREDENTIAL_FINGERPRINT_PEPPER: ci-only-pepper-not-used-anywhere

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      # An empty providers table makes every run unplannable, so the seed is a
      # deployment step and is verified as one.
      - name: Seed reference data
        run: npm run db:seed

      - name: Verify reference data
        run: |
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const db = new PrismaClient();
            db.provider.count().then((n) => {
              console.log('providers seeded:', n);
              process.exit(n >= 5 ? 0 : 1);
            });
          "

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Coverage rather than a bare `vitest run`: the coverage provider is a
      # dependency like any other, and one that never runs in CI is one whose
      # breakage surfaces on someone's laptop instead.
      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Production smoke (local mock provider only)
        env:
          SMOKE_ALLOW_MUTATION: "1"
          SMOKE_BASE_URL: http://127.0.0.1:3100
          WORKER_HEALTH_FILE: ${{ runner.temp }}/gem-worker-ci.json
        run: |
          set -euo pipefail
          cp -R public .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
          HOSTNAME=127.0.0.1 PORT=3100 node .next/standalone/server.js > web-smoke.log 2>&1 &
          WEB_PID=$!
          NODE_ENV=production node --import tsx src/worker/main.ts > worker-smoke.log 2>&1 &
          WORKER_PID=$!
          trap 'kill -TERM "$WORKER_PID" "$WEB_PID" 2>/dev/null || true; wait "$WORKER_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 60); do
            if node -e "fetch(process.env.SMOKE_BASE_URL + '/api/health/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && node scripts/worker-health.mjs; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" -eq 1
          if ! node tests/smoke-production.mjs; then
            cat web-smoke.log worker-smoke.log
            exit 1
          fi

      # Blocking, and last on purpose. An advisory is published by the outside
      # world, not by the author of the branch it fails: putting this first
      # meant one upstream disclosure erased the lint, type, test and build
      # signal on every open branch at once. Run it after the checks the author
      # can actually act on, so a red audit adds information instead of hiding
      # it. This job is a single cell, so the audit still runs exactly once per
      # commit; if this workflow ever grows an OS/Node matrix, move it to a job
      # of its own rather than repeat one registry-identical query per cell.
      #
      # Audit both supply-chain/build dependencies and production dependencies.
      # Dev dependencies now exist only in the build and one-shot migrator.
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTAINER_SMOKE_ALLOW_MUTATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Qualify production images and migration gate (mock only)
        env:
          CONTAINER_SMOKE_LOG_DIR: ${{ runner.temp }}/container-smoke-logs
        run: timeout --signal=TERM 25m bash scripts/container-smoke.sh

      - name: Preserve container failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-smoke-logs
          path: ${{ runner.temp }}/container-smoke-logs
          retention-days: 7
          if-no-files-found: ignore
