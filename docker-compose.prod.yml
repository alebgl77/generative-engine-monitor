##
## Production stack. Every secret is required — no fallback values, so a missing
## variable fails the deploy instead of silently starting with a known secret.
##
## See docs/production-runbook.md: stop OLD web AND workers before migration.
## This lease-generation upgrade is NOT rolling-compatible.
##

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:?}
  NEXTAUTH_URL: ${NEXTAUTH_URL:?}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
  REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
  CREDENTIAL_KEYS: ${CREDENTIAL_KEYS:?}
  CREDENTIAL_KEY_CURRENT: ${CREDENTIAL_KEY_CURRENT:?}
  CREDENTIAL_FINGERPRINT_PEPPER: ${CREDENTIAL_FINGERPRINT_PEPPER:?}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
  PERPLEXITY_MODEL: ${PERPLEXITY_MODEL:-sonar}
  SENTIMENT_ENABLED: ${SENTIMENT_ENABLED:-true}
  SENTIMENT_JUDGE_PROVIDER: ${SENTIMENT_JUDGE_PROVIDER:-openai}
  SENTIMENT_JUDGE_MODEL: ${SENTIMENT_JUDGE_MODEL:-gpt-5.6-luna}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
  MAX_SAMPLES_PER_RUN: ${MAX_SAMPLES_PER_RUN:-1000}
  MAX_SAMPLES_PER_USER_DAY: ${MAX_SAMPLES_PER_USER_DAY:-10000}
  MAX_ACTIVE_RUNS_PER_USER: ${MAX_ACTIVE_RUNS_PER_USER:-3}
  MAX_QUERIES_PER_PROJECT: ${MAX_QUERIES_PER_PROJECT:-1000}
  TZ: UTC
  SEED_DEMO: "false"
  NODE_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      TZ: UTC
    # Deliberately not published to the host.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment: *app-env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    init: true
    # Worker drain is 25s + 2s settling; leave room for DB lease releases.
    stop_grace_period: 120s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      <<: *app-env
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-5}
      WORKER_HEALTH_FILE: /tmp/gem-worker/heartbeat.json
      WORKER_HEALTH_MAX_AGE_MS: "30000"
    healthcheck:
      test: ["CMD", "node", "scripts/worker-health.mjs"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

volumes:
  pgdata:
